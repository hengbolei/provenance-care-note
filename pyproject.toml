[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "provenance-care-note"
version = "0.1.0"
description = "A provenance-first longitudinal care note prototype."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "cryptography>=45,<47",
  "psycopg[binary]>=3.2,<4.0",
  "httpx>=0.27,<1.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-postgres>=3.0,<4.0",
  "opentelemetry-api>=1.30,<2.0",
]

[project.optional-dependencies]
# Export agent traces over OTLP (Langfuse, Jaeger, any OpenTelemetry collector).
otel = [
  "opentelemetry-sdk>=1.30,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
]
dev = [
  "opentelemetry-sdk>=1.30,<2.0",
  "pytest>=8.0,<9.0",
  "pyyaml>=6.0,<7.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/carenote"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
