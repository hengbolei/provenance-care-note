name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check frontend syntax
        run: for f in src/carenote/static/*.js; do node --check "$f"; done
      - name: Test
        run: pytest -q

  demo:
    name: offline demo (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start demo stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Smoke test the review agent
        run: python3 scripts/smoke_demo.py http://127.0.0.1:8000
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop demo stack
        if: always()
        run: docker compose down --volumes
