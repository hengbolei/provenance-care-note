name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check frontend syntax
        run: for f in src/carenote/static/*.js; do node --check "$f"; done
      - name: Test
        run: pytest -q
      - name: Evaluation gate
        if: matrix.python-version == '3.12'
        run: |
          python evals/run_evals.py --check
          git diff --exit-code evals/REPORT.md

  demo:
    name: offline demo (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start demo stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Smoke test the review agent
        run: python3 scripts/smoke_demo.py http://127.0.0.1:8000
      - name: A paused run survives an app restart
        run: |
          run_id=$(python3 scripts/smoke_demo.py http://127.0.0.1:8000 --start-only)
          docker compose restart carenote
          docker compose up --detach --wait --wait-timeout 120
          python3 scripts/smoke_demo.py http://127.0.0.1:8000 --resume "$run_id"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop demo stack
        if: always()
        run: docker compose down --volumes

  postgres:
    name: postgres integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CARENOTE_TEST_DATABASE_URL: postgresql://postgres:postgres-ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Postgres tests
        run: pytest -q tests/test_agent_persistence.py tests/test_knowledge_postgres.py -rs
